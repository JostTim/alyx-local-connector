  /brain-regions:
    get:
      operationId: brain_regions_list
      description: |-
        get: **FILTERS**

        -   **id**: Allen primary key: `/brain-regions?id=687`
        -   **acronym**: iexact on acronym `/brain-regions?acronym=RSPv5`
        -   **name**: icontains on name `/brain-regions?name=retrosplenial`
        -   **description**: icontains on description `/brain-regions?description=RSPv5`
        -   **parent**: get child nodes `/brain-regions?parent=315`
        -   **ancestors**: get all ancestors for a given ID
        -   **descendants**: get all descendants for a given ID

        [===> brain region model reference](/admin/doc/models/experiments.brainregion)
      parameters:
      - in: query
        name: acronym
        schema:
          type: string
      - in: query
        name: ancestors
        schema:
          type: string
      - in: query
        name: descendants
        schema:
          type: string
      - in: query
        name: description
        schema:
          type: string
      - in: query
        name: django
        schema:
          type: string
      - in: query
        name: id
        schema:
          type: integer
      - name: limit
        required: false
        in: query
        description: Number of results to return per page.
        schema:
          type: integer
      - in: query
        name: name
        schema:
          type: string
      - name: offset
        required: false
        in: query
        description: The initial index from which to return the results.
        schema:
          type: integer
      - in: query
        name: parent
        schema:
          type: integer
          maximum: 2147483647
          minimum: -2147483648
      tags:
      - brain-regions
      security:
      - cookieAuth: []
      - tokenAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaginatedBrainRegionList'
          description: ''
