      required:
      - last_updated
      - tag
      - version
    Channel:
      type: object
      properties:
        id:
          type: string
          format: uuid
          readOnly: true
        trajectory_estimate:
          type: string
          format: uuid
        brain_region:
          type: integer
          maximum: 2147483647
          minimum: -2147483648
        name:
          type: string
          description: Long name
          maxLength: 255
        json:
          nullable: true
          description: Structured data, formatted in a user-defined way
        axial:
          type: number
          format: double
          nullable: true
          description: Distance in micrometers along the probe from the tip. 0 means
            the tip.
        lateral:
          type: number
          format: double
          nullable: true
          description: Distance in micrometers across the probe
        x:
          type: number
          format: double
          nullable: true
          title: X-ml (um)
          description: brain surface medio-lateral coordinate (um) ofthe insertion,
            right +, relative to Bregma
        y:
          type: number
          format: double
          nullable: true
          title: Y-ap (um)
          description: brain surface antero-posterior coordinate (um) of the insertion,
            front +, relative to Bregma
        z:
          type: number
          format: double
          nullable: true
          title: Z-dv (um)
          description: brain surface dorso-ventral coordinate (um) of the insertion,
            up +, relative to Bregma
      required:
      - id
    DataFormat:
      type: object
      properties:
        id:
          type: string
          format: uuid
          readOnly: true
        json:
          nullable: true
          description: Structured data, formatted in a user-defined way
        name:
          type: string
          description: short identifying name, e.g. 'npy'
          maxLength: 255
        description:
          type: string
          description: Human-readable description of the file format e.g. 'npy-formatted
            square numerical array'.
          maxLength: 255
        file_extension:
          type: string
          description: file extension, starting with a dot
          pattern: ^\.[^\.]+$
          maxLength: 255
        matlab_loader_function:
          type: string
          description: Name of MATLAB loader function'.
          maxLength: 255
        python_loader_function:
          type: string
          description: Name of Python loader function'.
          maxLength: 255
      required:
      - id
      - name
    DataRepository:
      type: object
      properties:
        id:
          type: string
          format: uuid
          readOnly: true
        name:
          type: string
          description: Nickname of the repository, to identify it
          maxLength: 255
        timezone:
          type: string
          description: Timezone of the server (see https://en.wikipedia.org/wiki/List_of_tz_database_time_zones)
          maxLength: 64
        globus_path:
          type: string
          title: Resource path
          description: relative path to the repository on the server, without the
            hostname. e.g. /lab/data/Adaptation. If the repository is on root of the
            device, leave blank
          pattern: ^[^/\\]
          maxLength: 1000
        hostname:
          type: string
          description: Host name of the network drive. e.g. Mountcastle
          pattern: ^[\w\.\-\s]+$
          maxLength: 200
        data_path:
          type: string
          readOnly: true
        repository_type:
          type: string
          nullable: true
        json:
          nullable: true
          description: Structured data, formatted in a user-defined way
      required:
      - data_path
      - id
      - name
    DataRepositoryType:
