  /weighings/{id}:
    get:
      operationId: weighings_retrieve
      description: Allows viewing of full detail and deleting a weighing.
      parameters:
      - in: path
        name: id
        schema:
          type: string
          format: uuid
        required: true
      tags:
      - weighings
      security:
      - cookieAuth: []
      - tokenAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/WeighingDetail'
          description: ''
    delete:
      operationId: weighings_destroy
      description: Allows viewing of full detail and deleting a weighing.
      parameters:
      - in: path
        name: id
        schema:
          type: string
          format: uuid
        required: true
      tags:
      - weighings
      security:
      - cookieAuth: []
      - tokenAuth: []
      responses:
        '204':
          description: No response body
