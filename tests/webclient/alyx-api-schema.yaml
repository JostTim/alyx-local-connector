      - public
      - remote_root
      - revision
      - session
      - subject
      - url
    DatasetFileRecords:
      type: object
      properties:
        id:
          type: string
          format: uuid
          readOnly: true
        relative_path:
          type: string
          description: path name within repository
          maxLength: 1000
        extra:
          type: string
          nullable: true
          description: 'extra of the file, separated by ''.'' or null if no extra.
            Example : pupil.00001. Null will be converted to '''' internally'
          maxLength: 255
        exists:
          type: boolean
          description: Whether the file exists in the data repository
        file_name:
          type: string
          readOnly: true
        hash:
          type: string
          nullable: true
          description: Hash of the data buffer, SHA-1 is 40 hex chars, while md5is
            32 hex chars
          maxLength: 64
      required:
      - file_name
      - id
    DatasetType:
      type: object
      properties:
        id:
          type: string
          format: uuid
          readOnly: true
        name:
          type: string
          description: Short identifying nickname, e.g. 'spikes.times'
          maxLength: 255
        created_by:
          type: string
          description: Required. 150 characters or fewer. Letters, digits and @/./+/-/_
            only.
          nullable: true
        description:
          type: string
          description: Human-readable description of data type. Should say what is
            in the file, and how to read it. For DataCollections, it should list what
            Datasets are expected in the the collection. E.g. 'Files related to spike
            events, including spikes.times.npy, spikes.clusters.npy, spikes.amps.npy,
            spikes.depths.npy
          maxLength: 1023
        filename_pattern:
          type: string
          nullable: true
          description: 'File name pattern (with wildcards) for this file in ALF naming
            convention. E.g. ''spikes.times.*'' or ''*.timestamps.*'', or ''spikes.*.*''
            for a DataCollection, which would include all files starting with the
            word ''spikes''. NB: Case-insensitive matching.If null, the name field
            must match the object.attribute part of the filename.'
          maxLength: 255
        object:
          type: string
          description: 'object (first part of the name) as per alf convention described
            here : https://int-brain-lab.github.io/ONE/alf_intro.html#dataset-name'
          pattern: ^[\w\-,;!#~&}{\]\[()]+$
          maxLength: 255
        attribute:
          type: string
          description: attribute (second part of the name) as per alf convention
          pattern: ^[\w\-,;!#~&}{\]\[()]+$
          maxLength: 255
        admin_url:
          type: string
          readOnly: true
      required:
      - admin_url
      - attribute
      - id
      - object
    Download:
