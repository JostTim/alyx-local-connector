        dataset_type:
          type: string
          description: Short identifying nickname, e.g. 'spikes.times'
        default_dataset:
          type: boolean
          nullable: true
        protected:
          type: string
          readOnly: true
        public:
          type: string
          readOnly: true
        tags:
