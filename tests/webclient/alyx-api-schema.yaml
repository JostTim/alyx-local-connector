        data_repository_pk:
          type: string
          format: uuid
        data_format_pk:
          type: string
          format: uuid
        revision_pk:
          type: string
          format: uuid
        dataset_type_pk:
          type: string
          format: uuid
        session_pk:
          type: string
          format: uuid
        remote_root:
          type: string
          readOnly: true
        subject:
          type: string
          readOnly: true
