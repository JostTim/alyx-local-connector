[project]
name = "alyx-connector"
authors = [
    { name = "Timothé Jost-Mousseau", email = "timothe.jost-mousseau@pasteur.fr" },
]
maintainers = [
    { name = "Timothé Jost-Mousseau", email = "timothe.jost-mousseau@pasteur.fr" },
]
description = "Alyx Connector, based on the Open Neurophysiology Environment"
readme = "README.md"
requires-python = ">=3.12,<3.13"
license = { text = "MIT" }
dynamic = ["version"]
dependencies = [
    "iblutil>=1.7.0",
    "natsort>=8.4.0",
    "numpy>=1.25.2",
    "packaging>=23.2",
    "pandas>=2.1.4",
    "PyYAML>=6.0.1",
    "Requests>=2.31.0",
    "pint",
    "rich",
    "openapi3-parser>=1.1.19",
    "pynwb>=3.1.2",
]

[project.urls]
homepage = "https://gitlab.pasteur.fr/haisslab/data-management/ONE"
repository = "https://gitlab.pasteur.fr/haisslab/data-management/ONE"
documentation = "https://gitlab.pasteur.fr/haisslab/data-management/ONE"

[project.optional-dependencies]
docs = ["mkdocs-material>=9.6.12"]
tests = ["pytest-cov>=6.2.1", "responses>=0.25.7"]

[dependency-groups]
docs = ["mkdocs-material>=9.6.11"]
celery = ["pytest-cov>=6.2.1", "responses>=0.25.7"]
dev = ["ipykernel>=6.29.5", "ruff", "ty"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.version]
path = "src/alyx_connector/__init__.py"
variable = "__version__"

[tool.hatch.build.targets.wheel]
packages = ["src/alyx_connector"]
include = [
  "src/alyx_connector/py.typed",
  "src/alyx_connector/**/*.pyi",
]

[tool.hatch.build.targets.sdist]
include = [
  "src/alyx_connector/py.typed",
  "src/alyx_connector/**/*.pyi",
]

[tool.pytest.ini_options]
addopts = "--pdbcls=IPython.terminal.debugger:TerminalPdb --cov-report xml --cov=alyx_connector --junitxml=pytest_results.xml"
testpaths = ["tests"]

[tool.coverage.run]
omit = [".venv/*", ".vscode/*", ".tests/*"]

[tool.flake8]
exclude = [
    ".git",
    "__pycache__",
    "__init__.py",
    "scratch_*.py",
    "tutorial_script.py",
    "venv",
    "test_imports.py",
    "build",
    "dist",
]
ignore = ["W504", "W503", "E266"]
max-line-length = 80

[tool.ty.src]
include = ["src"]
exclude = [".venv", "venv", "dist", "build", "**/__pycache__"]

[tool.ruff]
line-length = 80

[tool.ruff.lint]
ignore = []

[tool.ruff.lint.per-file-ignores]
"**/*.pyi" = []